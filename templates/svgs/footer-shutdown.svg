<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 180" width="720" height="180" class="motion" role="img" aria-label="Terminal shutdown sequence">
  <title>Shutdown Sequence</title>
  <desc>Animated terminal shutdown sequence mirroring the boot header</desc>

  <defs>
    <filter id="footer-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="footer-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1f2937" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="footer-accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{accent}}"/>
      <stop offset="100%" stop-color="{{accentDim}}"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="720" height="180" fill="{{bg}}"/>
  <rect width="720" height="180" fill="url(#footer-grid)" opacity="0.3"/>

  <!-- Terminal chrome: tall enough for every line (last line is the cursor
       at y=158, panel bottom is y=170, canvas ends at y=180) -->
  <rect x="20" y="10" width="680" height="160" rx="8" fill="{{bg}}" stroke="{{border}}" stroke-width="1"/>
  <rect x="20" y="10" width="680" height="32" rx="8" fill="{{bgElevated}}"/>
  <circle cx="42" cy="26" r="7" fill="{{error}}"/>
  <circle cx="64" cy="26" r="7" fill="{{warn}}"/>
  <circle cx="86" cy="26" r="7" fill="#3fb950"/>

  <!-- Title bar text -->
  <text x="120" y="32" font-family="{{fontMono}}" font-size="11" fill="{{fgMuted}}">~/github.com/Sujan-Bhat :: main ::</text>

  <!-- Shutdown lines (bracket spacing handled by tspans) -->
  <g font-family="{{fontMono}}" font-size="12" fill="{{fg}}" letter-spacing="0.3px">
    <g opacity="0" transform="translate(44, 58)">
      <text><tspan fill="{{fgMuted}}">[ </tspan><tspan fill="#3fb950">OK</tspan><tspan fill="{{fgMuted}}"> ]</tspan><tspan>  Saving session...</tspan></text>
      <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.3s" fill="freeze"/>
    </g>
    <g opacity="0" transform="translate(44, 78)">
      <text><tspan fill="{{fgMuted}}">[ </tspan><tspan fill="#3fb950">OK</tspan><tspan fill="{{fgMuted}}"> ]</tspan><tspan>  Writing .bash_history...</tspan></text>
      <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.3s" fill="freeze"/>
    </g>
    <g opacity="0" transform="translate(44, 98)">
      <text><tspan fill="{{fgMuted}}">[ </tspan><tspan fill="#3fb950">OK</tspan><tspan fill="{{fgMuted}}"> ]</tspan><tspan>  Closing connections...</tspan></text>
      <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.3s" fill="freeze"/>
    </g>
    <g opacity="0" transform="translate(44, 118)">
      <text><tspan fill="{{fgMuted}}">[ </tspan><tspan fill="{{accent}}" font-weight="700">BYE</tspan><tspan fill="{{fgMuted}}"> ]</tspan><tspan fill="{{accent}}">  Thanks for visiting!</tspan></text>
      <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.4s" fill="freeze"/>
    </g>
    <g opacity="0" transform="translate(44, 138)">
      <text x="52" fill="{{fgMuted}}">github.com/Sujan-Bhat</text>
      <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.4s" fill="freeze"/>
    </g>
  </g>

  <!-- Blinking prompt (inside the panel and inside the canvas) -->
  <g opacity="0" transform="translate(44, 158)">
    <text font-family="{{fontMono}}" font-size="12" fill="{{accent}}" letter-spacing="0.3px">$ _</text>
    <animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.2s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0" begin="2.0s" dur="1s" repeatCount="indefinite"/>
  </g>

  <!-- Decorative signal wave, kept clear of the prompt and the panel edge -->
  <g fill="none" stroke="url(#footer-accent-gradient)" stroke-width="1.5" opacity="0.4" transform="translate(0, 157)">
    <path d="M 20 0 Q 100 10 180 0 T 340 0 T 500 0 T 660 0" />
    <path d="M 20 5 Q 100 -5 180 5 T 340 5 T 500 5 T 660 5" stroke-dasharray="4,2"/>
  </g>
</svg>
