<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 {{_socialViewBoxH}}" width="720" height="{{_socialViewBoxH}}" class="motion" role="img" aria-label="Social links in command palette style">
  <title>Social Links - Command Palette</title>
  <desc>Terminal-style command palette showing social links</desc>

  <!-- Background (full canvas so light GitHub themes don't show white gutters) -->
  <rect width="720" height="{{_socialViewBoxH}}" fill="{{bg}}"/>

  <!-- Panel -->
  <rect x="20" y="10" width="680" height="{{_socialPanelH}}" rx="10" fill="{{bgElevated}}" stroke="{{border}}" stroke-width="1"/>

  <!-- Title bar -->
  <rect x="20" y="10" width="680" height="36" rx="10" fill="{{bg}}"/>
  <circle cx="42" cy="28" r="7" fill="{{error}}"/>
  <circle cx="64" cy="28" r="7" fill="{{warn}}"/>
  <circle cx="86" cy="28" r="7" fill="#3fb950"/>

  <!-- Title text + rule (rule stops before the right edge, never overflows) -->
  <text x="120" y="34" font-family="{{fontMono}}" font-size="12" fill="{{fgMuted}}">⌘K  Links</text>
  <line x1="205" y1="30" x2="678" y2="30" stroke="{{border}}" stroke-width="1" opacity="0.6"/>

  {{#each _socialRows}}
  <!-- Link {{index}}: {{label}} -->
  <a xlink:href="{{url}}" target="_blank" rel="noopener noreferrer">
    <g transform="translate(0, {{_rowY}})">
      <rect x="20" y="0" width="680" height="32" fill="transparent"/>
      <!-- Icon -->
      <g transform="translate(48, 8)">
        <rect x="0" y="0" width="16" height="16" rx="3" fill="{{icon_color}}"/>
        <text x="8" y="12" font-size="10" fill="{{_iconText}}" text-anchor="middle" font-weight="bold">{{icon}}</text>
      </g>
      <!-- Label -->
      <text x="88" y="21" font-family="{{fontUI}}" font-size="13" font-weight="500" fill="{{fg}}">{{label}}</text>
      <!-- URL -->
      <text x="200" y="21" font-family="{{fontMono}}" font-size="12" fill="{{fgMuted}}">{{url}}</text>
      <!-- Key hint -->
      <text x="580" y="21" font-family="{{fontMono}}" font-size="11" fill="{{border}}" opacity="0.5">[Enter]</text>
      <!-- Chevron -->
      <path d="M630 12 L640 16 L630 20" fill="none" stroke="{{border}}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </a>
  {{/each}}

  <!-- Row separators, one between each pair of rows -->
  <g stroke="{{border}}" stroke-width="0.5" opacity="0.5">
    {{#each _socialDividers}}
    <line x1="40" y1="{{y}}" x2="680" y2="{{y}}"/>
    {{/each}}
  </g>
</svg>
