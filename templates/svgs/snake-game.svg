<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 360" width="720" height="360" class="motion" role="img" aria-label="Animated Snake game demo in terminal style">
  <title>Terminal Arcade - Snake Demo</title>
  <desc>Animated Snake game demonstration with terminal aesthetic. Non-interactive demo - visit sujanbhat.dev/snake to play</desc>

  <defs>
    <filter id="snake-snake-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="snake-food-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="snake-snake-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{accent}}"/>
      <stop offset="100%" stop-color="{{accentDim}}"/>
    </linearGradient>
    <linearGradient id="snake-food-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{warn}}"/>
      <stop offset="100%" stop-color="{{error}}"/>
    </linearGradient>
    <pattern id="snake-grid-pattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="{{bg}}"/>
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#1f2937" stroke-width="0.5"/>
    </pattern>
    <path id="snake-snake-path" d="
      M 224 120
      L 208 120
      L 192 120
      L 176 120
      L 160 120
      L 144 120
      L 128 120
      L 112 120
      L 96 120
      L 80 120
      L 80 136
      L 80 152
      L 96 152
      L 112 152
      L 128 152
      L 144 152
      L 160 152
      L 176 152
      L 192 152
      L 208 152
      L 224 152
      L 240 152
      L 256 152
      L 272 152
      L 288 152
      L 304 152
      L 320 152
      L 336 152
      L 352 152
      L 368 152
      L 384 152
      L 384 136
      L 384 120
      L 384 104
      L 384 88
      L 368 88
      L 352 88
      L 336 88
      L 320 88
      L 288 88
      L 272 88
      L 256 88
      L 240 88
      L 224 88
      L 208 88
      L 192 88
      L 176 88
      L 160 88
      L 144 88
      L 128 88
      L 112 88
      L 96 88
      L 80 88
      L 80 104
      L 80 120
      Z" fill="none" stroke="none"/>
  </defs>

  <!-- Background -->
  <rect width="720" height="360" fill="{{bg}}"/>

  <!-- Terminal chrome -->
  <rect x="10" y="10" width="700" height="340" rx="8" fill="{{bg}}" stroke="{{border}}" stroke-width="1"/>
  <rect x="10" y="10" width="700" height="36" rx="8" fill="{{bgElevated}}"/>
  <circle cx="30" cy="28" r="7" fill="{{error}}"/>
  <circle cx="52" cy="28" r="7" fill="{{warn}}"/>
  <circle cx="74" cy="28" r="7" fill="#3fb950"/>
  <text x="100" y="34" font-family="{{fontMono}}" font-size="12" fill="{{fgMuted}}">$ python3 snake.py --demo</text>

  <!-- Game area -->
  <g transform="translate(60, 60)">
    <!-- Grid background -->
    <rect x="0" y="0" width="480" height="240" fill="url(#snake-grid-pattern)"/>
    <rect x="0" y="0" width="480" height="240" fill="none" stroke="{{border}}" stroke-width="2" rx="4"/>

    <!-- Food positions along path (key points) -->
    <g filter="url(#snake-food-glow)">
      <circle cx="200" cy="120" r="6" fill="url(#snake-food-gradient)">
        <animate attributeName="opacity" values="0;1;1;0" dur="8s" repeatCount="indefinite" begin="0s"/>
        <animate attributeName="r" values="6;7;6" dur="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="80" cy="144" r="6" fill="url(#snake-food-gradient)">
        <animate attributeName="opacity" values="0;1;1;0" dur="8s" repeatCount="indefinite" begin="2s"/>
        <animate attributeName="r" values="6;7;6" dur="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="368" cy="152" r="6" fill="url(#snake-food-gradient)">
        <animate attributeName="opacity" values="0;1;1;0" dur="8s" repeatCount="indefinite" begin="4s"/>
        <animate attributeName="r" values="6;7;6" dur="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="384" cy="96" r="6" fill="url(#snake-food-gradient)">
        <animate attributeName="opacity" values="0;1;1;0" dur="8s" repeatCount="indefinite" begin="6s"/>
        <animate attributeName="r" values="6;7;6" dur="1s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Snake body segments using animateMotion -->
    <g filter="url(#snake-snake-glow)" fill="url(#snake-snake-gradient)">
      <g>
        <circle r="7" cx="0" cy="0">
          <animateMotion href="#snake-snake-path" dur="16s" repeatCount="indefinite" rotate="auto"/>
        </circle>
        <circle cx="-2" cy="-2" r="1.5" fill="{{bg}}">
          <animateMotion href="#snake-snake-path" dur="16s" repeatCount="indefinite" rotate="auto"/>
        </circle>
        <circle cx="2" cy="-2" r="1.5" fill="{{bg}}">
          <animateMotion href="#snake-snake-path" dur="16s" repeatCount="indefinite" rotate="auto"/>
        </circle>
      </g>
      <circle r="7" opacity="0.95"><animateMotion href="#snake-snake-path" dur="16s" repeatCount="indefinite" rotate="auto" begin="0.15s"/></circle>
      <circle r="7" opacity="0.9"><animateMotion href="#snake-snake-path" dur="16s" repeatCount="indefinite" rotate="auto" begin="0.3s"/></circle>
      <circle r="7" opacity="0.85"><animateMotion href="#snake-snake-path" dur="16s" repeatCount="indefinite" rotate="auto" begin="0.45s"/></circle>
      <circle r="7" opacity="0.8"><animateMotion href="#snake-snake-path" dur="16s" repeatCount="indefinite" rotate="auto" begin="0.6s"/></circle>
      <circle r="7" opacity="0.75"><animateMotion href="#snake-snake-path" dur="16s" repeatCount="indefinite" rotate="auto" begin="0.75s"/></circle>
      <circle r="7" opacity="0.7"><animateMotion href="#snake-snake-path" dur="16s" repeatCount="indefinite" rotate="auto" begin="0.9s"/></circle>
      <circle r="7" opacity="0.65"><animateMotion href="#snake-snake-path" dur="16s" repeatCount="indefinite" rotate="auto" begin="1.05s"/></circle>
      <circle r="7" opacity="0.6"><animateMotion href="#snake-snake-path" dur="16s" repeatCount="indefinite" rotate="auto" begin="1.2s"/></circle>
    </g>

    <!-- Score display -->
    <g font-family="{{fontMono}}" font-size="11" fill="{{fgMuted}}" transform="translate(0, -18)">
      <text x="0" y="0">SCORE:</text>
      <text x="60" y="0" fill="{{accent}}" font-weight="700">0</text>
      <text x="120" y="0">HIGH:</text>
      <text x="175" y="0" fill="{{warn}}" font-weight="700">1247</text>
      <text x="250" y="0">LEN:</text>
      <text x="295" y="0" fill="{{accent}}" font-weight="700">12</text>
    </g>
  </g>

  <!-- Side panel with controls -->
  <g transform="translate(570, 60)" font-family="{{fontMono}}" font-size="11">
    <text x="0" y="0" fill="{{accent}}" font-weight="600" font-size="12" font-family="{{fontUI}}">CONTROLS</text>
    <line x1="0" y1="8" x2="120" y2="8" stroke="{{border}}" stroke-width="1"/>
    <g fill="{{fg}}">
      <text x="0" y="28">▲  W / Up</text>
      <text x="0" y="48">▼  S / Down</text>
      <text x="0" y="68">◄  A / Left</text>
      <text x="0" y="88">►  D / Right</text>
    </g>
    <g fill="{{fgMuted}}" font-size="10">
      <text x="85" y="28">Move Up</text>
      <text x="85" y="48">Move Down</text>
      <text x="85" y="68">Move Left</text>
      <text x="85" y="88">Move Right</text>
    </g>
    <line x1="0" y1="104" x2="120" y2="104" stroke="{{border}}" stroke-width="1"/>
    <text x="0" y="122" fill="{{warn}}" font-weight="600">SPACE</text>
    <text x="50" y="122" fill="{{fgMuted}}" font-size="10">Pause/Resume</text>
    <text x="0" y="142" fill="{{warn}}" font-weight="600">ESC</text>
    <text x="50" y="142" fill="{{fgMuted}}" font-size="10">Quit Game</text>
    <line x1="0" y1="158" x2="120" y2="158" stroke="{{border}}" stroke-width="1"/>
    <a xlink:href="https://sujanbhat.dev/snake" target="_blank" rel="noopener noreferrer">
      <g transform="translate(0, 170)">
        <rect x="0" y="0" width="120" height="36" rx="6" fill="{{bgElevated}}" stroke="{{accent}}" stroke-width="1.5" filter="url(#snake-snake-glow)"/>
        <text x="60" y="22" fill="{{accent}}" font-family="{{fontUI}}" font-size="12" font-weight="600" text-anchor="middle">PLAY NOW</text>
        <text x="60" y="22" fill="{{accent}}" font-family="{{fontUI}}" font-size="12" font-weight="600" text-anchor="middle" opacity="0.5">
          <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
        </text>
      </g>
    </a>
    <g transform="translate(0, 230)" fill="{{border}}" font-size="9">
      <text x="0" y="0"># Konami: ↑↑↓↓←→←→BA</text>
      <text x="0" y="16"># check console...</text>
    </g>
  </g>

  <!-- Bottom status bar -->
  <g font-family="{{fontMono}}" font-size="11" transform="translate(20, 310)">
    <text x="0" y="0" fill="{{fgMuted}}">$</text>
    <text x="16" y="0" fill="{{fg}}"> ./snake.py --demo</text>
    <text x="200" y="0" fill="{{fgMuted}}">│</text>
    <text x="216" y="0" fill="{{accent}}">Press [SPACE] to play on sujanbhat.dev</text>
    <text x="580" y="0" fill="{{border}}">█ DEMO MODE</text>
  </g>
</svg>