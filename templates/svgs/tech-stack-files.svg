<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 420" width="720" height="420" class="motion" role="img" aria-label="Tech stack displayed as terminal ls -la output">
  <title>Tech Stack - Module Registry</title>
  <desc>Terminal ls -la style listing of tech stack organized by category</desc>

  <defs>
    <filter id="tech-row-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="tech-accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="{{accent}}"/>
      <stop offset="100%" stop-color="{{accentDim}}"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="720" height="420" fill="{{bg}}"/>

  <!-- Terminal chrome -->
  <rect x="10" y="10" width="700" height="400" rx="8" fill="{{bg}}" stroke="{{border}}" stroke-width="1"/>
  <rect x="10" y="10" width="700" height="36" rx="8" fill="{{bgElevated}}"/>
  <circle cx="30" cy="28" r="7" fill="{{error}}"/>
  <circle cx="52" cy="28" r="7" fill="{{warn}}"/>
  <circle cx="74" cy="28" r="7" fill="#3fb950"/>
  <text x="100" y="34" font-family="{{fontMono}}" font-size="12" fill="{{fgMuted}}">$ ls -la ~/tech-stack/</text>

  <!-- Column headers -->
  <g font-family="{{fontMono}}" font-size="11" fill="{{fgMuted}}" transform="translate(20, 60)">
    <text x="0" y="0">permissions</text>
    <text x="120" y="0">links</text>
    <text x="160" y="0">owner</text>
    <text x="210" y="0">group</text>
    <text x="270" y="0">size</text>
    <text x="330" y="0">modified</text>
    <text x="430" y="0">name</text>
  </g>

  <!-- Divider -->
  <line x1="20" y1="74" x2="700" y2="74" stroke="{{border}}" stroke-width="0.5" opacity="0.5"/>

  {{#each tech_stack.languages}}
  <!-- Language file {{index}} -->
  <g transform="translate(20, {{_yPos}})" font-family="{{fontMono}}" font-size="12" opacity="0">
    <rect x="-4" y="-14" width="680" height="24" fill="transparent"/>
    <text x="0" y="0" fill="{{fgMuted}}">-rw-r--r--</text>
    <text x="120" y="0" fill="{{fgMuted}}">1</text>
    <text x="160" y="0" fill="{{fgMuted}}">sujan</text>
    <text x="210" y="0" fill="{{fgMuted}}">staff</text>
    <text x="270" y="0" fill="{{fgMuted}}">1.2K</text>
    <text x="330" y="0" fill="{{fgMuted}}">Nov 16 10:00</text>
    <g transform="translate(426, 0)">
      <g transform="translate(0, -10)">
        <rect x="0" y="0" width="16" height="16" rx="2" fill="{{color}}"/>
        <text x="8" y="11" font-size="9" fill="{{_textColor}}" text-anchor="middle" font-weight="bold">{{icon}}</text>
      </g>
      <text x="22" y="0" fill="{{fg}}">{{file}}</text>
    </g>
    <animate attributeName="opacity" from="0" to="1" begin="{{_animDelay}}s" dur="0.3s" fill="freeze"/>
    <animate attributeName="transform" from="translate(10, {{_yFrom}})" to="translate(20, {{_yFrom}})" begin="{{_animDelay}}s" dur="0.3s" fill="freeze" additive="sum"/>
  </g>
  {{/each}}

  <!-- FRONTEND DIRECTORY -->
  <g transform="translate(20, 268)" font-family="{{fontMono}}" font-size="12" opacity="0">
    <rect x="-4" y="-14" width="680" height="24" fill="transparent"/>
    <text x="0" y="0" fill="{{fgMuted}}">drwxr-xr-x</text>
    <text x="120" y="0" fill="{{fgMuted}}">2</text>
    <text x="160" y="0" fill="{{fgMuted}}">sujan</text>
    <text x="210" y="0" fill="{{fgMuted}}">staff</text>
    <text x="270" y="0" fill="{{fgMuted}}">64B</text>
    <text x="330" y="0" fill="{{fgMuted}}">Nov 16 10:00</text>
    <text x="430" y="0" fill="{{accent}}" font-weight="600">Frontend/</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.45s" dur="0.3s" fill="freeze"/>
    <animate attributeName="transform" from="translate(10, 268)" to="translate(20, 268)" begin="0.45s" dur="0.3s" fill="freeze" additive="sum"/>
  </g>

  {{#each tech_stack.frontend}}
  <g transform="translate(20, {{_yPos}})" font-family="{{fontMono}}" font-size="12" opacity="0">
    <rect x="-4" y="-14" width="680" height="24" fill="transparent"/>
    <text x="0" y="0" fill="{{fgMuted}}">-rw-r--r--</text>
    <text x="120" y="0" fill="{{fgMuted}}">1</text>
    <text x="160" y="0" fill="{{fgMuted}}">sujan</text>
    <text x="210" y="0" fill="{{fgMuted}}">staff</text>
    <text x="270" y="0" fill="{{fgMuted}}">2.1K</text>
    <text x="330" y="0" fill="{{fgMuted}}">Nov 16 10:00</text>
    <g transform="translate(426, 0)">
      <g transform="translate(0, -10)">
        <rect x="0" y="0" width="16" height="16" rx="2" fill="{{color}}"/>
        <text x="8" y="11" font-size="8" fill="{{_textColor}}" text-anchor="middle" font-weight="bold">{{icon}}</text>
      </g>
      <text x="22" y="0" fill="{{fg}}">{{file}}</text>
    </g>
    <animate attributeName="opacity" from="0" to="1" begin="{{_animDelay}}s" dur="0.3s" fill="freeze"/>
    <animate attributeName="transform" from="translate(10, {{_yFrom}})" to="translate(20, {{_yFrom}})" begin="{{_animDelay}}s" dur="0.3s" fill="freeze" additive="sum"/>
  </g>
  {{/each}}

  <!-- BACKEND DIRECTORY -->
  <g transform="translate(20, 372)" font-family="{{fontMono}}" font-size="12" opacity="0">
    <rect x="-4" y="-14" width="680" height="24" fill="transparent"/>
    <text x="0" y="0" fill="{{fgMuted}}">drwxr-xr-x</text>
    <text x="120" y="0" fill="{{fgMuted}}">2</text>
    <text x="160" y="0" fill="{{fgMuted}}">sujan</text>
    <text x="210" y="0" fill="{{fgMuted}}">staff</text>
    <text x="270" y="0" fill="{{fgMuted}}">64B</text>
    <text x="330" y="0" fill="{{fgMuted}}">Nov 16 10:00</text>
    <text x="430" y="0" fill="{{accent}}" font-weight="600">Backend/</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.65s" dur="0.3s" fill="freeze"/>
    <animate attributeName="transform" from="translate(10, 372)" to="translate(20, 372)" begin="0.65s" dur="0.3s" fill="freeze" additive="sum"/>
  </g>

  {{#each tech_stack.tools}}
  <g transform="translate(20, {{_yPos}})" font-family="{{fontMono}}" font-size="12" opacity="0">
    <rect x="-4" y="-14" width="680" height="24" fill="transparent"/>
    <text x="0" y="0" fill="{{fgMuted}}">-rw-r--r--</text>
    <text x="120" y="0" fill="{{fgMuted}}">1</text>
    <text x="160" y="0" fill="{{fgMuted}}">sujan</text>
    <text x="210" y="0" fill="{{fgMuted}}">staff</text>
    <text x="270" y="0" fill="{{fgMuted}}">94B</text>
    <text x="330" y="0" fill="{{fgMuted}}">Nov 16 10:00</text>
    <g transform="translate(426, 0)">
      <g transform="translate(0, -10)">
        <rect x="0" y="0" width="16" height="16" rx="2" fill="{{color}}"/>
        <text x="8" y="11" font-size="8" fill="#fff" text-anchor="middle" font-weight="bold">{{icon}}</text>
      </g>
      <text x="22" y="0" fill="{{fg}}">{{file}}</text>
    </g>
    <animate attributeName="opacity" from="0" to="1" begin="{{_animDelay}}s" dur="0.3s" fill="freeze"/>
    <animate attributeName="transform" from="translate(10, {{_yFrom}})" to="translate(20, {{_yFrom}})" begin="{{_animDelay}}s" dur="0.3s" fill="freeze" additive="sum"/>
  </g>
  {{/each}}
</svg>