<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-label="Terminal shutdown sequence" class="prefix__motion" viewBox="0 0 720 140"><desc>Animated terminal shutdown sequence mirroring the boot header</desc><defs><filter id="prefix__footer-glow" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="coloredBlur" stdDeviation="3"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="prefix__footer-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1f2937" stroke-width=".5" d="M20 0H0v20"/></pattern><linearGradient id="prefix__footer-accent-gradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00d9a5"/><stop offset="100%" stop-color="#00b88a"/></linearGradient></defs><path fill="#0d1117" d="M0 0h720v140H0z"/><path fill="url(#prefix__footer-grid)" d="M0 0h720v140H0z" opacity=".3"/><rect width="680" height="120" x="20" y="10" fill="#0d1117" stroke="#30363d" rx="8"/><rect width="680" height="32" x="20" y="10" fill="#161b22" rx="8"/><circle cx="42" cy="26" r="7" fill="#f85149"/><circle cx="64" cy="26" r="7" fill="#f0883e"/><circle cx="86" cy="26" r="7" fill="#3fb950"/><text x="120" y="32" fill="#8b949e" font-family="JetBrains Mono, monospace" font-size="11">~/github.com/Sujan-Bhat :: main ::</text><g fill="#e6edf3" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing=".3"><g opacity="0" transform="translate(44 54)"><text fill="#8b949e">[</text><text x="14" fill="#3fb950">OK</text><text x="42" fill="#8b949e">]</text><text x="58"> Saving session...</text><animate fill="freeze" attributeName="opacity" begin="0.2s" dur="0.3s" from="0" to="1"/></g><g opacity="0" transform="translate(44 74)"><text fill="#8b949e">[</text><text x="14" fill="#3fb950">OK</text><text x="42" fill="#8b949e">]</text><text x="58"> Writing .bash_history...</text><animate fill="freeze" attributeName="opacity" begin="0.5s" dur="0.3s" from="0" to="1"/></g><g opacity="0" transform="translate(44 94)"><text fill="#8b949e">[</text><text x="14" fill="#3fb950">OK</text><text x="42" fill="#8b949e">]</text><text x="58"> Closing connections...</text><animate fill="freeze" attributeName="opacity" begin="0.8s" dur="0.3s" from="0" to="1"/></g><g opacity="0" transform="translate(44 116)"><text fill="#8b949e">[</text><text x="14" fill="#00d9a5" font-weight="700">BYE</text><text x="74" fill="#8b949e">]</text><text x="92" fill="#00d9a5"> Thanks for visiting!  👋</text><animate fill="freeze" attributeName="opacity" begin="1.2s" dur="0.4s" from="0" to="1"/></g><g opacity="0" transform="translate(44 136)"><text fill="#8b949e">        github.com/Sujan-Bhat</text><animate fill="freeze" attributeName="opacity" begin="1.5s" dur="0.4s" from="0" to="1"/></g></g><g opacity="0" transform="translate(44 156)"><text fill="#00d9a5">$</text><text x="14" fill="#00d9a5">_</text><animate fill="freeze" attributeName="opacity" begin="1.8s" dur="0.2s" from="0" to="1"/><animate attributeName="opacity" begin="2.0s" dur="1s" repeatCount="indefinite" values="1;0"/></g><g fill="none" stroke="url(#prefix__footer-accent-gradient)" stroke-width="1.5" opacity=".4" transform="translate(0 130)"><path d="M20 0q80 10 160 0t160 0 160 0 160 0"/><path stroke-dasharray="4 2" d="M20 5q80-10 160 0t160 0 160 0 160 0"/></g></svg>