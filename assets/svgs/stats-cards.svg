<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 100" width="720" height="100" class="motion" role="img" aria-label="GitHub profile statistics: views, followers, stars, repositories">
  <title>Profile Statistics</title>
  <desc>Custom animated stat cards for profile views, followers, stars, and repositories</desc>

  <defs>
    <filter id="stats-card-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="stats-accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d9a5"/>
      <stop offset="100%" stop-color="#00b88a"/>
    </linearGradient>
  </defs>

  <!-- Card 1: Profile Views -->
  <g>
    <rect x="10" y="10" width="165" height="80" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#stats-card-glow)"/>
    <rect x="14" y="14" width="4" height="52" rx="2" fill="url(#stats-accent-gradient)"/>
    <text x="28" y="38" font-family="Space Grotesk, sans-serif" font-size="11" font-weight="500" fill="#8b949e" text-transform="uppercase" letter-spacing="0.8px">Profile Views</text>
    <text x="28" y="64" font-family="JetBrains Mono, monospace" font-size="24" font-weight="700" fill="#e6edf3" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.5s" fill="freeze"/>
      <animate attributeName="y" from="74" to="64" begin="0.1s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.46 0.45 0.94"/>
    </text>
    <rect x="28" y="70" width="120" height="3" rx="1.5" fill="#30363d"/>
    <rect x="28" y="70" width="0" height="3" rx="1.5" fill="url(#stats-accent-gradient)">
      <animate attributeName="width" from="0" to="78" begin="0.3s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.25 0.46 0.45 0.94"/>
    </rect>
  </g>

  <!-- Card 2: Followers -->
  <g>
    <rect x="185" y="10" width="165" height="80" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#stats-card-glow)"/>
    <rect x="189" y="14" width="4" height="52" rx="2" fill="url(#stats-accent-gradient)"/>
    <text x="203" y="38" font-family="Space Grotesk, sans-serif" font-size="11" font-weight="500" fill="#8b949e" text-transform="uppercase" letter-spacing="0.8px">Followers</text>
    <text x="203" y="64" font-family="JetBrains Mono, monospace" font-size="24" font-weight="700" fill="#e6edf3" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.5s" fill="freeze"/>
      <animate attributeName="y" from="74" to="64" begin="0.2s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.46 0.45 0.94"/>
    </text>
    <rect x="203" y="70" width="120" height="3" rx="1.5" fill="#30363d"/>
    <rect x="203" y="70" width="0" height="3" rx="1.5" fill="url(#stats-accent-gradient)">
      <animate attributeName="width" from="0" to="65" begin="0.4s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.25 0.46 0.45 0.94"/>
    </rect>
  </g>

  <!-- Card 3: Total Stars -->
  <g>
    <rect x="360" y="10" width="165" height="80" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#stats-card-glow)"/>
    <rect x="364" y="14" width="4" height="52" rx="2" fill="url(#stats-accent-gradient)"/>
    <text x="378" y="38" font-family="Space Grotesk, sans-serif" font-size="11" font-weight="500" fill="#8b949e" text-transform="uppercase" letter-spacing="0.8px">Total Stars</text>
    <text x="378" y="64" font-family="JetBrains Mono, monospace" font-size="24" font-weight="700" fill="#e6edf3" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
      <animate attributeName="y" from="74" to="64" begin="0.3s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.46 0.45 0.94"/>
    </text>
    <rect x="378" y="70" width="120" height="3" rx="1.5" fill="#30363d"/>
    <rect x="378" y="70" width="0" height="3" rx="1.5" fill="url(#stats-accent-gradient)">
      <animate attributeName="width" from="0" to="88" begin="0.5s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.25 0.46 0.45 0.94"/>
    </rect>
  </g>

  <!-- Card 4: Repositories -->
  <g>
    <rect x="535" y="10" width="165" height="80" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#stats-card-glow)"/>
    <rect x="539" y="14" width="4" height="52" rx="2" fill="url(#stats-accent-gradient)"/>
    <text x="553" y="38" font-family="Space Grotesk, sans-serif" font-size="11" font-weight="500" fill="#8b949e" text-transform="uppercase" letter-spacing="0.8px">Repositories</text>
    <text x="553" y="64" font-family="JetBrains Mono, monospace" font-size="24" font-weight="700" fill="#e6edf3" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.5s" fill="freeze"/>
      <animate attributeName="y" from="74" to="64" begin="0.4s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.46 0.45 0.94"/>
    </text>
    <rect x="553" y="70" width="120" height="3" rx="1.5" fill="#30363d"/>
    <rect x="553" y="70" width="0" height="3" rx="1.5" fill="url(#stats-accent-gradient)">
      <animate attributeName="width" from="0" to="42" begin="0.6s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.25 0.46 0.45 0.94"/>
    </rect>
  </g>

  <!-- Decorative corner accents -->
  <g fill="none" stroke="#00d9a5" stroke-width="1.5" opacity="0.3">
    <path d="M10 10 L10 25 M10 10 L25 10"/>
    <path d="M175 10 L160 10 M175 10 L175 25"/>
    <path d="M185 10 L200 10 M185 10 L185 25"/>
    <path d="M355 10 L340 10 M355 10 L355 25"/>
    <path d="M360 10 L375 10 M360 10 L360 25"/>
    <path d="M535 10 L550 10 M535 10 L535 25"/>
    <path d="M705 10 L690 10 M705 10 L705 25"/>
  </g>
</svg>