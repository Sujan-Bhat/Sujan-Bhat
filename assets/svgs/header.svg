<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="720" height="280" aria-label="Terminal boot sequence initializing Sujan Bhat developer profile" class="prefix__motion" viewBox="0 0 720 280"><title>Boot Sequence</title><desc>Animated terminal boot sequence showing system initialization</desc><defs><pattern id="prefix__header-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1f2937" stroke-width=".5" d="M20 0H0v20"/></pattern><filter id="prefix__header-glow" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="coloredBlur" stdDeviation="3"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><path fill="#0d1117" d="M0 0h720v280H0z"/><path fill="url(#prefix__header-grid)" d="M0 0h720v280H0z" opacity=".3"/><rect width="680" height="248" x="20" y="16" fill="#0d1117" stroke="#30363d" rx="8"/><rect width="680" height="36" x="20" y="16" fill="#161b22" rx="8"/><circle cx="42" cy="34" r="7" fill="#f85149"/><circle cx="64" cy="34" r="7" fill="#f0883e"/><circle cx="86" cy="34" r="7" fill="#3fb950"/><text x="120" y="40" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12">~/github.com/Sujan-Bhat :: main ::</text><g fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing=".3"><g opacity="0" transform="translate(44 72)"><text><tspan fill="#8b949e">[ </tspan><tspan fill="#3fb950">OK</tspan><tspan fill="#8b949e"> ]</tspan><tspan>  Initializing Sujan Bhat v2.4.1...</tspan></text><animate fill="freeze" attributeName="opacity" begin="0.2s" dur="0.3s" from="0" to="1"/></g><g opacity="0" transform="translate(44 96)"><text><tspan fill="#8b949e">[ </tspan><tspan fill="#3fb950">OK</tspan><tspan fill="#8b949e"> ]</tspan><tspan>  Loading full-stack modules...</tspan></text><animate fill="freeze" attributeName="opacity" begin="0.5s" dur="0.3s" from="0" to="1"/></g><g opacity="0" transform="translate(44 120)"><text><tspan fill="#8b949e">[ </tspan><tspan fill="#3fb950">OK</tspan><tspan fill="#8b949e"> ]</tspan><tspan>  Mounting /dev/skills (js, ts, python, c, cpp)...</tspan></text><animate fill="freeze" attributeName="opacity" begin="0.8s" dur="0.3s" from="0" to="1"/></g><g opacity="0" transform="translate(44 144)"><text><tspan fill="#8b949e">[ </tspan><tspan fill="#3fb950">OK</tspan><tspan fill="#8b949e"> ]</tspan><tspan>  Starting backend services (node, fastapi, django, postgres)...</tspan></text><animate fill="freeze" attributeName="opacity" begin="1.1s" dur="0.3s" from="0" to="1"/></g><g opacity="0" transform="translate(44 168)"><text><tspan fill="#8b949e">[ </tspan><tspan fill="#3fb950">OK</tspan><tspan fill="#8b949e"> ]</tspan><tspan>  Launching frontend (react, next, tailwind)...</tspan></text><animate fill="freeze" attributeName="opacity" begin="1.4s" dur="0.3s" from="0" to="1"/></g><g opacity="0" transform="translate(44 192)"><text><tspan fill="#8b949e">[ </tspan><tspan fill="#3fb950">OK</tspan><tspan fill="#8b949e"> ]</tspan><tspan>  Connecting to github.com/Sujan-Bhat...</tspan></text><animate fill="freeze" attributeName="opacity" begin="1.7s" dur="0.3s" from="0" to="1"/></g><g opacity="0" transform="translate(44 220)"><text><tspan fill="#8b949e">[ </tspan><tspan fill="#00d9a5" font-weight="700">READY</tspan><tspan fill="#8b949e"> ]</tspan><tspan fill="#00d9a5">  System online. Awaiting input...</tspan></text><animate fill="freeze" attributeName="opacity" begin="2.1s" dur="0.4s" from="0" to="1"/><animate attributeName="opacity" begin="2.5s" dur="1.5s" repeatCount="indefinite" values="1;0.3;1"/></g><g opacity="0" transform="translate(44 244)"><text fill="#00d9a5">$ _</text><animate fill="freeze" attributeName="opacity" begin="2.6s" dur="0.2s" from="0" to="1"/><animate attributeName="opacity" begin="2.8s" dur="1s" repeatCount="indefinite" values="1;0"/></g></g></svg