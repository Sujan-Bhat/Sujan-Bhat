<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 300" width="720" height="300" class="motion" role="img" aria-label="About me configuration in YAML format with syntax highlighting">
  <title>About Me - Config.yaml</title>
  <desc>YAML configuration file showing developer profile with syntax highlighting</desc>

  <defs>
    <linearGradient id="about-accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d9a5"/>
      <stop offset="100%" stop-color="#00b88a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="720" height="300" fill="#0d1117"/>

  <!-- Terminal chrome -->
  <rect x="10" y="10" width="700" height="280" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <rect x="10" y="10" width="700" height="36" rx="8" fill="#161b22"/>
  <circle cx="30" cy="28" r="7" fill="#f85149"/>
  <circle cx="52" cy="28" r="7" fill="#f0883e"/>
  <circle cx="74" cy="28" r="7" fill="#3fb950"/>
  <text x="100" y="34" font-family="JetBrains Mono, monospace" font-size="12" fill="#8b949e">$ cat ~/config.yaml</text>

  <!-- Line numbers and content -->
  <g font-family="JetBrains Mono, monospace" font-size="13" transform="translate(20, 60)" letter-spacing="0.3px">
    <!-- Line 1 -->
    <g opacity="0" transform="translate(0, 0)">
      <text x="0" y="0" fill="#30363d" text-anchor="end" font-size="11">1</text>
      <text x="35" y="0" fill="#00d9a5">name:</text>
      <text x="95" y="0" fill="#f0883e">"Sujan Bhat"</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.3s" fill="freeze"/>
      <animate attributeName="transform" from="translate(-15, 0)" to="translate(0, 0)" begin="0.1s" dur="0.3s" fill="freeze" additive="sum"/>
    </g>

    <!-- Line 2 -->
    <g opacity="0" transform="translate(0, 24)">
      <text x="0" y="0" fill="#30363d" text-anchor="end" font-size="11">2</text>
      <text x="35" y="0" fill="#00d9a5">role:</text>
      <text x="95" y="0" fill="#f0883e">"Full-stack Developer"</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.3s" fill="freeze"/>
      <animate attributeName="transform" from="translate(-15, 24)" to="translate(0, 24)" begin="0.15s" dur="0.3s" fill="freeze" additive="sum"/>
    </g>

    <!-- Line 3 -->
    <g opacity="0" transform="translate(0, 48)">
      <text x="0" y="0" fill="#30363d" text-anchor="end" font-size="11">3</text>
      <text x="35" y="0" fill="#00d9a5">location:</text>
      <text x="130" y="0" fill="#f0883e">"Bangalore, India"</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.3s" fill="freeze"/>
      <animate attributeName="transform" from="translate(-15, 48)" to="translate(0, 48)" begin="0.2s" dur="0.3s" fill="freeze" additive="sum"/>
    </g>

    <!-- Line 4 -->
    <g opacity="0" transform="translate(0, 72)">
      <text x="0" y="0" fill="#30363d" text-anchor="end" font-size="11">4</text>
      <text x="35" y="0" fill="#00d9a5">current_focus:</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.25s" dur="0.3s" fill="freeze"/>
      <animate attributeName="transform" from="translate(-15, 72)" to="translate(0, 72)" begin="0.25s" dur="0.3s" fill="freeze" additive="sum"/>
    </g>

    <!-- Line 5 -->
    <g opacity="0" transform="translate(0, 96)">
      <text x="0" y="0" fill="#30363d" text-anchor="end" font-size="11">5</text>
      <text x="35" y="0" fill="#8b949e">-</text>
      <text x="50" y="0" fill="#e6edf3"> Building scalable web applications</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.3s" fill="freeze"/>
      <animate attributeName="transform" from="translate(-15, 96)" to="translate(0, 96)" begin="0.3s" dur="0.3s" fill="freeze" additive="sum"/>
    </g>

    <!-- Line 6 -->
    <g opacity="0" transform="translate(0, 120)">
      <text x="0" y="0" fill="#30363d" text-anchor="end" font-size="11">6</text>
      <text x="35" y="0" fill="#8b949e">-</text>
      <text x="50" y="0" fill="#e6edf3"> Exploring system programming with Rust</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.35s" dur="0.3s" fill="freeze"/>
      <animate attributeName="transform" from="translate(-15, 120)" to="translate(0, 120)" begin="0.35s" dur="0.3s" fill="freeze" additive="sum"/>
    </g>

    <!-- Line 7 -->
    <g opacity="0" transform="translate(0, 144)">
      <text x="0" y="0" fill="#30363d" text-anchor="end" font-size="11">7</text>
      <text x="35" y="0" fill="#8b949e">-</text>
      <text x="50" y="0" fill="#e6edf3"> Contributing to open source</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.3s" fill="freeze"/>
      <animate attributeName="transform" from="translate(-15, 144)" to="translate(0, 144)" begin="0.4s" dur="0.3s" fill="freeze" additive="sum"/>
    </g>

    <!-- Line 8 -->
    <g opacity="0" transform="translate(0, 168)">
      <text x="0" y="0" fill="#30363d" text-anchor="end" font-size="11">8</text>
      <text x="35" y="0" fill="#00d9a5">learning:</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.45s" dur="0.3s" fill="freeze"/>
      <animate attributeName="transform" from="translate(-15, 168)" to="translate(0, 168)" begin="0.45s" dur="0.3s" fill="freeze" additive="sum"/>
    </g>

    <!-- Line 9 -->
    <g opacity="0" transform="translate(0, 192)">
      <text x="0" y="0" fill="#30363d" text-anchor="end" font-size="11">9</text>
      <text x="35" y="0" fill="#8b949e">-</text>
      <text x="50" y="0" fill="#e6edf3"> Distributed systems</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.3s" fill="freeze"/>
      <animate attributeName="transform" from="translate(-15, 192)" to="translate(0, 192)" begin="0.5s" dur="0.3s" fill="freeze" additive="sum"/>
    </g>

    <!-- Line 10 -->
    <g opacity="0" transform="translate(0, 216)">
      <text x="0" y="0" fill="#30363d" text-anchor="end" font-size="11">10</text>
      <text x="35" y="0" fill="#8b949e">-</text>
      <text x="50" y="0" fill="#e6edf3"> Cloud native architectures</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.55s" dur="0.3s" fill="freeze"/>
      <animate attributeName="transform" from="translate(-15, 216)" to="translate(0, 216)" begin="0.55s" dur="0.3s" fill="freeze" additive="sum"/>
    </g>

    <!-- Line 11 -->
    <g opacity="0" transform="translate(0, 240)">
      <text x="0" y="0" fill="#30363d" text-anchor="end" font-size="11">11</text>
      <text x="35" y="0" fill="#8b949e">-</text>
      <text x="50" y="0" fill="#e6edf3"> WebAssembly</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.3s" fill="freeze"/>
      <animate attributeName="transform" from="translate(-15, 240)" to="translate(0, 240)" begin="0.6s" dur="0.3s" fill="freeze" additive="sum"/>
    </g>

    <!-- Line 12 -->
    <g opacity="0" transform="translate(0, 264)">
      <text x="0" y="0" fill="#30363d" text-anchor="end" font-size="11">12</text>
      <text x="35" y="0" fill="#00d9a5">interests:</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.65s" dur="0.3s" fill="freeze"/>
      <animate attributeName="transform" from="translate(-15, 264)" to="translate(0, 264)" begin="0.65s" dur="0.3s" fill="freeze" additive="sum"/>
    </g>
  </g>

  <!-- Right column for interests -->
  <g font-family="JetBrains Mono, monospace" font-size="13" transform="translate(400, 60)" letter-spacing="0.3px">
    <!-- Line 13 -->
    <g opacity="0" transform="translate(0, 0)">
      <text x="0" y="0" fill="#30363d" text-anchor="end" font-size="11">13</text>
      <text x="35" y="0" fill="#8b949e">-</text>
      <text x="50" y="0" fill="#e6edf3"> Open source contribution</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.3s" fill="freeze"/>
      <animate attributeName="transform" from="translate(-15, 0)" to="translate(0, 0)" begin="0.7s" dur="0.3s" fill="freeze" additive="sum"/>
    </g>

    <!-- Line 14 -->
    <g opacity="0" transform="translate(0, 24)">
      <text x="0" y="0" fill="#30363d" text-anchor="end" font-size="11">14</text>
      <text x="35" y="0" fill="#8b949e">-</text>
      <text x="50" y="0" fill="#e6edf3"> Technical writing</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.75s" dur="0.3s" fill="freeze"/>
      <animate attributeName="transform" from="translate(-15, 24)" to="translate(0, 24)" begin="0.75s" dur="0.3s" fill="freeze" additive="sum"/>
    </g>

    <!-- Line 15 -->
    <g opacity="0" transform="translate(0, 48)">
      <text x="0" y="0" fill="#30363d" text-anchor="end" font-size="11">15</text>
      <text x="35" y="0" fill="#8b949e">-</text>
      <text x="50" y="0" fill="#e6edf3"> Mentoring developers</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.3s" fill="freeze"/>
      <animate attributeName="transform" from="translate(-15, 48)" to="translate(0, 48)" begin="0.8s" dur="0.3s" fill="freeze" additive="sum"/>
    </g>

    <!-- Line 16 -->
    <g opacity="0" transform="translate(0, 72)">
      <text x="0" y="0" fill="#30363d" text-anchor="end" font-size="11">16</text>
      <text x="35" y="0" fill="#8b949e">-</text>
      <text x="50" y="0" fill="#e6edf3"> Hackathons</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.85s" dur="0.3s" fill="freeze"/>
      <animate attributeName="transform" from="translate(-15, 72)" to="translate(0, 72)" begin="0.85s" dur="0.3s" fill="freeze" additive="sum"/>
    </g>

    <!-- Line 17 -->
    <g opacity="0" transform="translate(0, 96)">
      <text x="0" y="0" fill="#30363d" text-anchor="end" font-size="11">17</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.3s" fill="freeze"/>
      <animate attributeName="transform" from="translate(-15, 96)" to="translate(0, 96)" begin="0.9s" dur="0.3s" fill="freeze" additive="sum"/>
    </g>

    <!-- Line 18 - prompt -->
    <g opacity="0" transform="translate(0, 120)">
      <text x="0" y="0" fill="#30363d" text-anchor="end" font-size="11">18</text>
      <text x="35" y="0" fill="#8b949e">#</text>
      <text x="50" y="0" fill="#8b949e"> vim: ft=yaml</text>
      <animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.3s" fill="freeze"/>
      <animate attributeName="transform" from="translate(-15, 120)" to="translate(0, 120)" begin="1.0s" dur="0.3s" fill="freeze" additive="sum"/>
    </g>

    <!-- Line 19 - cursor -->
    <g opacity="0" transform="translate(0, 144)">
      <text x="0" y="0" fill="#30363d" text-anchor="end" font-size="11">19</text>
      <text x="35" y="0" fill="#00d9a5">$</text>
      <text x="50" y="0" fill="#00d9a5">_</text>
      <animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.3s" fill="freeze"/>
      <animate attributeName="transform" from="translate(-15, 144)" to="translate(0, 144)" begin="1.1s" dur="0.3s" fill="freeze" additive="sum"/>
      <animate attributeName="opacity" values="1;0" begin="1.4s" dur="1s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Vertical divider between columns -->
  <line x1="380" y1="60" x2="380" y2="280" stroke="#30363d" stroke-width="0.5" opacity="0.3"/>
</svg>