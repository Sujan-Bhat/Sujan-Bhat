<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 420" width="720" height="420" class="motion" role="img" aria-label="Tech stack displayed as terminal ls -la output with Languages, Frontend, Backend, Tools directories">
  <title>Tech Stack - Module Registry</title>
  <desc>Terminal ls -la style listing of tech stack organized by category</desc>

  <defs>
    <filter id="tech-row-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
